name: odoo-project
services:
  database:
    build:
      context: .
      dockerfile: container/database/Dockerfile
    container_name: odoo-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 12345678
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: container/admin/Dockerfile
    container_name: odoo-web
    depends_on:
      - database
    ports:
      - 8069:8069
    volumes:
      - ./odoo-src:/opt/odoo/odoo-src
      - ./odoo.conf:/opt/odoo/odoo.conf
    working_dir: /opt/odoo
    command: ["python3", "odoo-src/odoo-bin", "-c", "odoo.conf"]
volumes:
  odoo-db-data: